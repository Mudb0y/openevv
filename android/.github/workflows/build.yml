name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A build of the engine with nothing cached writes and compiles every language's rules, which
    # takes well over an hour on a hosted runner.
    timeout-minutes: 300
    steps:
      # The full history gives the build number (the commit count) and the release notes. The engine
      # is a submodule.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # What decides the native libraries is the submodule's commit, the patches laid on it, and the
      # files buildNative names as its inputs, so those are the key. A checkout gives every source a
      # new modification time, so the engine's Makefile would rebuild its objects anyway, and the
      # finished libraries are what is kept instead.
      - name: Compute native cache key
        id: native-key
        run: echo "commit=$(git -C native/openevv rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: app/build/native/jniLibs
          key: native-${{ steps.native-key.outputs.commit }}-${{ hashFiles('native/patches/**', 'native/android.mk', 'native/build-native.sh', '.gitmodules', 'app/src/main/cpp/evv_jni.c') }}

      # Signs builds with the same debug key as the maintainer's own builds, so that installed
      # development builds can update in place. Pull requests from forks do not get the secret,
      # so they are signed with a new debug key. AGP looks for the key in ANDROID_USER_HOME when it
      # is set and in ~/.android otherwise, and makes a new one if nothing is there, so the folder
      # is pinned for every later step rather than guessed.
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          dir=${ANDROID_USER_HOME:-$HOME/.android}
          echo "ANDROID_USER_HOME=$dir" >> "$GITHUB_ENV"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$dir"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$dir/debug.keystore"
            keytool -list -v -keystore "$dir/debug.keystore" -storepass android -alias androiddebugkey | grep SHA256
            echo "Installed the debug keystore."
          else
            echo "No debug keystore secret, so the build uses a new debug key."
          fi

      # The runner's preinstalled NDK is in ANDROID_NDK_HOME, which build-native.sh reads. With the
      # libraries restored from the cache, buildNative is skipped rather than run again.
      - name: Build debug APKs
        env:
          SKIP_NATIVE: ${{ steps.native-cache.outputs.cache-hit == 'true' && '-x buildNative' || '' }}
        run: ./gradlew assembleDebug $SKIP_NATIVE --console=plain

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest -x buildNative --console=plain

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

      # One APK per ABI, plus a universal one.
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Replaces the rolling "dev" pre-release. The first line of the notes is "build: <commit count>",
  # and each later line is "- <short hash> <subject>", newest first.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Publish development build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          hash=$(git rev-parse HEAD)
          short=${hash:0:7}
          {
            echo "build: $count"
            echo
            # %H cut to 7 characters, since %h can be longer when a short hash is ambiguous.
            git log -n 50 --format='%H %s' HEAD | while IFS= read -r line; do
              echo "- ${line:0:7} ${line:41}"
            done
          } > release-notes.md
          # AGP names the splits app-<abi>-debug.apk and the universal one app-universal-debug.apk.
          files=()
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="apks/app-$abi-debug.apk"
            if [ ! -f "$apk" ]; then
              echo "The $abi APK was not found." >&2
              exit 1
            fi
            cp "$apk" "evvdroid-$abi.apk"
            files+=("evvdroid-$abi.apk")
          done
          title="Development build $count ($short)"
          tag=dev
          if gh release view "$tag" > /dev/null 2>&1; then
            # Update the release in place. Deleting and creating it again counts as a new release,
            # which notifies everyone watching the repository.
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md --prerelease
          else
            gh release create "$tag" "${files[@]}" --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
