summary = "Eloquence (openevv)"
description = """Речевой движок IBM Embedded ViaVoice, восстановленный из объектов 1999 года на C, в виде синтезатора для NVDA. Движок загружается прямо в процесс NVDA: ничего больше устанавливать не нужно, и искать на компьютере движок IBM не требуется. В эту сборку входит русский язык."""
