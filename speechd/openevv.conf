# OpenEVV needs no module-specific configuration. Speech Dispatcher sends
# language, voice, rate, pitch, pitch range, volume, punctuation, spelling,
# and capitalization settings over its module protocol for every message.
#
# Add the module to speechd.conf with an absolute path while testing:
# AddModule "openevv" "/path/to/openevv/build/sd_openevv" "/path/to/openevv/speechd/openevv.conf"
