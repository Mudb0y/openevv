# OpenEVV needs no module-specific configuration. Speech Dispatcher sends
# language, voice, rate, pitch, pitch range, volume, punctuation, spelling,
# and capitalization settings over its module protocol for every message.
#
# Speech Dispatcher finds an installed module by itself. Do not add an
# AddModule line to speechd.conf for it: the first explicit registration there
# turns module discovery off for every module at once, which hides every other
# installed voice. docs/speech-dispatcher.md says what to do instead when
# testing a build that has not been installed.
